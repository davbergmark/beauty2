<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Beauty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            margin: 0;
            overflow-x: hidden;
        }
        h1 {
            font-family: 'Playfair Display', serif;
        }
        .rose-gradient {
            background: linear-gradient(to bottom, rgba(9, 9, 11, 0) 0%, rgba(9, 9, 11, 0.8) 80%, rgba(9, 9, 11, 1) 100%);
        }
        .fade-in {
            animation: fadeIn 2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">

    <!-- Hero Section -->
    <main class="relative w-full h-screen flex items-center justify-center overflow-hidden">
        
        <!-- Background Image Container -->
        <div class="absolute inset-0 z-0">
            <img 
                src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&q=80&w=1920" 
                alt="A dark red rose" 
                class="w-full h-full object-cover opacity-60 scale-105 transition-transform duration-1000 hover:scale-100"
                onerror="this.src='https://images.unsplash.com/photo-1496062031456-07b8f162a322?auto=format&fit=crop&q=80&w=1920'"
            >
            <!-- Overlay for legibility and dark mood -->
            <div class="absolute inset-0 rose-gradient"></div>
        </div>

        <!-- Content -->
        <div class="relative z-10 text-center px-4 fade-in">
            <span class="block text-rose-500 uppercase tracking-[0.3em] text-sm mb-4 font-light">Experience Elegance</span>
            <h1 class="text-5xl md:text-7xl lg:text-8xl font-bold tracking-tight mb-6">
                Welcome to <span class="italic text-rose-100">Beauty</span>
            </h1>
            <div class="w-24 h-px bg-rose-800 mx-auto mb-8"></div>
            <p class="max-w-md mx-auto text-zinc-400 text-lg leading-relaxed font-light">
                Discover the intersection of simplicity and sophistication. 
                A curated space dedicated to the art of the sublime.
            </p>
            
            <button class="mt-10 px-8 py-3 border border-zinc-700 hover:border-rose-500 hover:text-rose-500 transition-all duration-300 rounded-full text-sm tracking-widest uppercase">
                Explore More
            </button>
        </div>
    </main>

    <!-- Footer-like detail -->
    <footer class="absolute bottom-8 w-full text-center text-zinc-600 text-xs tracking-widest uppercase">
        &copy; 2024 Beauty Studio &bull; Aesthetic Excellence
    </footer>

</body>
</html>
